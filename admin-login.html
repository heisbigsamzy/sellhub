<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — SellHub</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@560&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green-900:#0B3D28; --green-700:#0F7A4A; --green-600:#149A5C; --green-400:#3FC17F;
    --mint-100:#EAF7EF; --mint-50:#F5FBF7; --ink:#0B0F0C; --gray-600:#5B6B62; --gray-300:#DCE6E0;
    --radius-lg:24px; --radius-md:18px; --radius-sm:12px; --radius-pill:100px;
    --shadow-soft:0 20px 60px -20px rgba(11,15,12,0.25);
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Manrope',sans-serif; color:var(--ink); overflow-x:hidden; padding:20px;
    background:
      radial-gradient(700px 420px at 82% -6%, rgba(63,193,127,0.14), transparent 60%),
      linear-gradient(180deg, var(--mint-50), #fff 62%);}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
  }
  a:focus-visible, button:focus-visible, input:focus-visible{outline:2.5px solid var(--green-600); outline-offset:2px; border-radius:8px;}

  .card{background:#fff; border:1px solid var(--gray-300); border-radius:var(--radius-lg); padding:38px; max-width:380px; width:100%; box-shadow:var(--shadow-soft);}
  .login-mark{width:40px; height:40px; border-radius:var(--radius-sm); background:linear-gradient(150deg,var(--green-400),var(--green-700)); display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Fraunces',serif; font-weight:700; font-size:18px; box-shadow:0 10px 20px -6px rgba(15,122,74,0.45); margin-bottom:18px;}
  h1{font-family:'Fraunces',serif; font-weight:560; font-size:23px; margin:0 0 6px; letter-spacing:-0.01em;}
  p{color:var(--gray-600); font-size:13.5px; margin:0 0 24px; line-height:1.5;}
  label{font-size:12.5px; font-weight:700; display:block; margin-bottom:6px;}
  input{width:100%; padding:12px 14px; border-radius:var(--radius-sm); border:1.5px solid var(--gray-300); font-size:14px; font-family:'Manrope',sans-serif; transition:border-color .2s;}
  input:focus{outline:none; border-color:var(--green-600);}
  button{width:100%; margin-top:18px; padding:13.5px; background:linear-gradient(155deg,var(--green-600),var(--green-900)); color:#fff; border:none; border-radius:var(--radius-pill); font-weight:700; font-size:14.5px; cursor:pointer; font-family:'Manrope',sans-serif; box-shadow:0 14px 28px -10px rgba(15,122,74,0.55); transition:transform .2s, box-shadow .2s;}
  button:hover{transform:translateY(-1px); box-shadow:0 18px 34px -10px rgba(15,122,74,0.65);}
  button:active{transform:scale(0.98);}
  .msg{margin-top:12px; font-size:13px; font-weight:700; color:#B4232C; min-height:16px;}
</style>
</head>
<body>
  <div class="card">
    <div class="login-mark">S</div>
    <h1>Admin Login</h1>
    <p>This area is for the SellHub platform owner only.</p>
    <label>Password</label>
    <input id="password" type="password" placeholder="Enter admin password" onkeydown="if(event.key==='Enter') login()">
    <button onclick="login()">Log In</button>
    <div class="msg" id="msg"></div>
  </div>

<script>
  async function login(){
    const password = document.getElementById('password').value;
    const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
    const result = await res.json();
    if (result.ok) {
      localStorage.setItem('sellhub_admin_token', result.token);
      window.location.href = '/admin-dashboard';
    } else {
      document.getElementById('msg').textContent = result.message;
    }
  }
</script>
</body>
</html>
