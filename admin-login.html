<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — SellHub</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@560&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green-900:#0B3D28; --green-700:#0F7A4A; --green-600:#149A5C;
    --mint-100:#EAF7EF; --mint-50:#F5FBF7; --ink:#0B0F0C; --gray-600:#5B6B62; --gray-300:#DCE6E0;
  }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Manrope',sans-serif; background:linear-gradient(180deg, var(--mint-50), #fff 60%);}
  .card{background:#fff; border:1px solid var(--gray-300); border-radius:22px; padding:36px; max-width:380px; width:100%; box-shadow:0 30px 60px -30px rgba(11,15,12,0.25);}
  h1{font-family:'Fraunces',serif; font-weight:560; font-size:22px; margin:0 0 6px;}
  p{color:var(--gray-600); font-size:13.5px; margin:0 0 24px;}
  label{font-size:12.5px; font-weight:700; display:block; margin-bottom:6px;}
  input{width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--gray-300); font-size:14px; font-family:'Manrope',sans-serif;}
  button{width:100%; margin-top:18px; padding:13px; background:linear-gradient(155deg,var(--green-600),var(--green-900)); color:#fff; border:none; border-radius:100px; font-weight:700; cursor:pointer; font-family:'Manrope',sans-serif;}
  .msg{margin-top:12px; font-size:13px; font-weight:700; color:#B4232C;}
</style>
</head>
<body>
  <div class="card">
    <h1>Admin Login</h1>
    <p>This area is for the SellHub platform owner only.</p>
    <label>Password</label>
    <input id="password" type="password" placeholder="Enter admin password" onkeydown="if(event.key==='Enter') login()">
    <button onclick="login()">Log In</button>
    <div class="msg" id="msg"></div>
  </div>

<script>
  async function login(){
    const password = document.getElementById('password').value;
    const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
    const result = await res.json();
    if (result.ok) {
      localStorage.setItem('sellhub_admin_token', result.token);
      window.location.href = '/admin-dashboard';
    } else {
      document.getElementById('msg').textContent = result.message;
    }
  }
</script>
</body>
</html>
