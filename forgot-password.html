<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Forgot Password — SellHub</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --green-900:#0B3D28; --green-700:#0F7A4A; --green-600:#149A5C; --mint-100:#EAF7EF; --mint-50:#F5FBF7; --ink:#0B0F0C; --gray-600:#5B6B62; --gray-300:#DCE6E0; }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Poppins',sans-serif; color:var(--ink);
    background:radial-gradient(700px 420px at 82% -6%, rgba(63,193,127,0.18), transparent 60%), linear-gradient(180deg, var(--mint-50), #fff 62%); padding:40px 20px;}
  .card{width:100%; max-width:400px; background:#fff; border:1px solid var(--gray-300); border-radius:24px; padding:36px 32px; box-shadow:0 30px 60px -24px rgba(11,15,12,0.22);}
  .logo{display:flex; align-items:center; gap:10px; font-family:'Poppins',sans-serif; font-weight:800; font-size:19px; margin-bottom:20px;}
  .logo-mark{width:28px; height:28px; border-radius:8px; overflow:hidden; flex-shrink:0; box-shadow:0 6px 14px -4px rgba(15,122,74,0.35);}
  .logo-mark img{width:100%; height:100%; object-fit:cover; display:block;}
  h1{font-family:'Poppins',sans-serif; font-size:22px; font-weight:800; margin:0 0 8px;}
  p{color:var(--gray-600); font-size:14px; margin:0 0 16px;}
  input{width:100%; padding:12px 14px; margin-top:10px; border-radius:10px; border:1.5px solid var(--gray-300); font-size:16px; font-family:'Poppins',sans-serif; outline:none; transition:border-color .2s;}
  input:focus{border-color:var(--green-600);}
  button{width:100%; margin-top:18px; padding:13px; background:linear-gradient(155deg,var(--green-600),var(--green-900)); color:#fff; border:none; border-radius:100px; font-weight:700; font-size:14.5px; cursor:pointer; font-family:'Poppins',sans-serif; box-shadow:0 14px 28px -10px rgba(15,122,74,0.55); transition:transform .2s, box-shadow .2s;}
  button:hover{transform:translateY(-1px); box-shadow:0 18px 34px -10px rgba(15,122,74,0.65);}
  button:active{transform:translateY(0) scale(0.98);}
  button:disabled{opacity:0.7; cursor:default; transform:none;}
  #msg, #msg2{margin-top:14px; font-size:13.5px; font-weight:700; color:var(--green-900);}
  #step2{display:none; margin-top:24px; border-top:1px solid var(--gray-300); padding-top:20px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
  a:focus-visible, button:focus-visible, input:focus-visible{outline:2.5px solid var(--green-600); outline-offset:2px; border-radius:8px;}
  .mail-help{background:#FFF8E1; border:1.5px solid #F0C75E; border-radius:12px; padding:12px 14px; margin:12px 0 4px; font-size:13px; line-height:1.55; color:#5c3d00; text-align:left;}
  .mail-help .resend{width:auto; margin-top:10px; padding:9px 16px; font-size:13px; background:#fff; color:#0B3D28; border:1.5px solid #DCE6E0; box-shadow:none; opacity:1;}
  .mail-help .resend:disabled{opacity:.6; cursor:not-allowed;}
</style>
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png?v=4">
<link rel="apple-touch-icon" href="/icon-180.png?v=4">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0F7A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SellHub">
<link rel="stylesheet" href="/ui.css?v=1">
</head>
<body class="auth">
  <div class="card">
    <div class="logo"><span class="logo-mark"><img src="/icon-192.png?v=4" alt="" width="32" height="32"></span>SellHub</div>
    <h1>Forgot your password?</h1>
    <p>We'll email you a 6-digit code to reset it.</p>
    <input id="email" type="email" placeholder="Your email">
    <button id="sendCodeBtn" onclick="sendResetCode()">Send Me a Code</button>
    <div id="msg"></div>

    <div id="step2">
      <h1 style="font-size:18px;">Set a new password</h1>
            <div class="mail-help">
        <b>Check your inbox for the code.</b> Can't see it? Open <b>Promotions</b>, <b>Updates</b> or <b>Spam</b> and search for <b>SellHub</b>. If it's there, tap <b>Not spam</b> so next emails arrive normally.
        <button type="button" id="resendBtn" class="resend" disabled>Resend code</button>
      </div>
      <input id="code" placeholder="Enter 6-digit code">
      <input id="newPassword" type="password" placeholder="New password">
      <button onclick="resetPassword()">Set New Password</button>
      <div id="msg2"></div>
    </div>
  </div>

<script>
  
  // "Can't find the email?" help: a resend button that unlocks after 30 seconds.
  let resendTimer = null;
  function startResendTimer(){
    const btn = document.getElementById('resendBtn');
    if (!btn) return;
    let left = 30;
    clearInterval(resendTimer);
    btn.disabled = true;
    btn.textContent = 'Resend code in ' + left + 's';
    resendTimer = setInterval(() => {
      left--;
      if (left <= 0) { clearInterval(resendTimer); btn.disabled = false; btn.textContent = 'Resend code'; }
      else btn.textContent = 'Resend code in ' + left + 's';
    }, 1000);
  }
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('resendBtn');
    if (btn) btn.addEventListener('click', () => { RESEND_ACTION(); });
  });

  let RESEND_ACTION = () => { sendResetCode(); };
  async function sendResetCode(){
    const email = document.getElementById('email').value;
    const btn = document.getElementById('sendCodeBtn');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Sending code…';
    document.getElementById('msg').textContent = 'Sending your code — this can take a few seconds.';
    try {
      const res = await fetch('/api/request-reset', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email }) });
      const result = await res.json();
      document.getElementById('msg').textContent = result.message;
      if (result.ok) document.getElementById('step2').style.display = 'block'; if (result.ok) startResendTimer();
    } catch (err) {
      document.getElementById('msg').textContent = 'Something went wrong. Please check your connection and try again.';
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }
  async function resetPassword(){
    const email = document.getElementById('email').value;
    const code = document.getElementById('code').value;
    const newPassword = document.getElementById('newPassword').value;
    const res = await fetch('/api/reset-password', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email, code, newPassword }) });
    const result = await res.json();
    document.getElementById('msg2').textContent = result.message;
  }
</script>
<script src="/support-widget.js?v=7" defer></script>
</body>
</html>
