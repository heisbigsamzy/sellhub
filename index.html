<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OTP Test</title>
<style>
  body{font-family:sans-serif; background:#F5FBF7; display:flex; justify-content:center; padding:60px 20px;}
  .card{background:#fff; padding:34px; border-radius:20px; max-width:360px; width:100%; box-shadow:0 20px 40px rgba(0,0,0,0.08);}
  h1{font-size:20px;}
  input{width:100%; padding:10px; margin-top:10px; border-radius:8px; border:1px solid #ccc; box-sizing:border-box;}
  button{width:100%; margin-top:14px; padding:12px; background:#0F7A4A; color:#fff; border:none; border-radius:100px; font-weight:bold; cursor:pointer;}
  #msg{margin-top:14px; font-weight:bold;}
  #step2{display:none; margin-top:20px; border-top:1px solid #eee; padding-top:20px;}
</style>
</head>
<body>
  <div class="card">
    <h1>Step 1: Enter your email</h1>
    <input id="email" type="email" placeholder="you@example.com">
    <button onclick="sendCode()">Send Me a Code</button>
    <div id="msg"></div>

    <div id="step2">
      <h1>Step 2: Enter the code</h1>
      <input id="code" placeholder="123456">
      <button onclick="checkCode()">Verify Code</button>
      <div id="msg2"></div>
    </div>
  </div>

<script>
  async function sendCode(){
    const email = document.getElementById('email').value;
    const res = await fetch('/api/send-code', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email })
    });
    const result = await res.json();
    document.getElementById('msg').textContent = result.message;
    if (result.ok) document.getElementById('step2').style.display = 'block';
  }

  async function checkCode(){
    const email = document.getElementById('email').value;
    const code = document.getElementById('code').value;
    const res = await fetch('/api/check-code', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, code })
    });
    const result = await res.json();
    document.getElementById('msg2').textContent = result.message;
  }
</script>
</body>
</html>
