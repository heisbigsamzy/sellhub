<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Log in to SellHub</title>
<meta name="description" content="Log in to your SellHub customer or seller account.">
<link rel="canonical" href="https://sellhubmarket.xyz/login">
<meta property="og:site_name" content="SellHub">
<meta property="og:title" content="Log in to SellHub">
<meta property="og:description" content="Log in to your SellHub customer or seller account.">
<meta property="og:url" content="https://sellhubmarket.xyz/login">
<meta property="og:type" content="website">
<meta property="og:image" content="https://sellhubmarket.xyz/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --green-900:#0B3D28; --green-700:#0F7A4A; --green-600:#149A5C; --mint-100:#EAF7EF; --mint-50:#F5FBF7; --ink:#0B0F0C; --gray-600:#5B6B62; --gray-300:#DCE6E0; }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Poppins',sans-serif; color:var(--ink);
    background:radial-gradient(700px 420px at 82% -6%, rgba(63,193,127,0.18), transparent 60%), linear-gradient(180deg, var(--mint-50), #fff 62%); padding:40px 20px;}
  .card{width:100%; max-width:400px; background:#fff; border:1px solid var(--gray-300); border-radius:24px; padding:36px 32px; box-shadow:0 30px 60px -24px rgba(11,15,12,0.22);}
  .logo{display:flex; align-items:center; gap:10px; font-family:'Poppins',sans-serif; font-weight:800; font-size:19px; margin-bottom:20px;}
  .logo-mark{width:28px; height:28px; border-radius:8px; overflow:hidden; flex-shrink:0; box-shadow:0 6px 14px -4px rgba(15,122,74,0.35);}
  .logo-mark img{width:100%; height:100%; object-fit:cover; display:block;}
  h1{font-family:'Poppins',sans-serif; font-size:24px; font-weight:800; margin:0 0 20px;}
  input{width:100%; padding:12px 14px; margin-top:10px; border-radius:10px; border:1.5px solid var(--gray-300); font-size:16px; font-family:'Poppins',sans-serif; outline:none; transition:border-color .2s;}
  input:focus{border-color:var(--green-600);}
  button{width:100%; margin-top:18px; padding:13px; background:linear-gradient(155deg,var(--green-600),var(--green-900)); color:#fff; border:none; border-radius:100px; font-weight:700; font-size:14.5px; cursor:pointer; font-family:'Poppins',sans-serif; box-shadow:0 14px 28px -10px rgba(15,122,74,0.55); transition:transform .2s, box-shadow .2s;}
  button:hover{transform:translateY(-1px); box-shadow:0 18px 34px -10px rgba(15,122,74,0.65);}
  button:active{transform:translateY(0) scale(0.98);}
  #msg{margin-top:14px; font-size:13.5px; font-weight:700; color:var(--green-900);}
  a{color:var(--green-700); font-size:13px; font-weight:600; transition:opacity .2s;}
  a:hover{opacity:0.75;}
  p.foot{margin-top:14px; font-size:13px; color:var(--gray-600);}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
  a:focus-visible, button:focus-visible, input:focus-visible{outline:2.5px solid var(--green-600); outline-offset:2px; border-radius:8px;}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png?v=3">
<link rel="apple-touch-icon" href="/icon-180.png?v=3">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0F7A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SellHub">
<link rel="stylesheet" href="/ui.css?v=1">
</head>
<body class="auth">
  <div class="card">
    <div class="logo"><span class="logo-mark"><img src="/icon-192.png?v=3" alt="" width="32" height="32"></span>SellHub</div>
    <h1>Log in to SellHub</h1>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Log In</button>
    <div style="text-align:center; margin:16px 0; color:var(--gray-600); font-size:12.5px;">— or —</div>
    <div id="g_id_signin" style="display:flex; justify-content:center;"></div>
    <div id="msg"></div>
    <p class="foot">New customer? <a id="signupLink" href="/signup">Create a free account</a></p>
    <p class="foot">New seller? <a href="/seller-signup">Create your store</a></p>
    <p class="foot"><a id="forgotLink" href="/forgot-password">Forgot password?</a></p>
  </div>

<script>
  // Set when a guest was sent here from a seller's store link after trying
  // to buy — e.g. clicking Buy on a shared product link while logged out.
  // Logging in returns them to exactly that store/product instead of the
  // dashboard, and the signup/forgot-password links carry it along too in
  // case they switch pages first.
  const nextParam = new URLSearchParams(window.location.search).get('next');
  if (nextParam) {
    const su = document.getElementById('signupLink');
    if (su) su.href = '/signup?next=' + encodeURIComponent(nextParam);
    const fp = document.getElementById('forgotLink');
    if (fp) fp.href = '/forgot-password?next=' + encodeURIComponent(nextParam);
  }

  async function login(){
    const data = {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    };
    const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
    const result = await res.json();
    document.getElementById('msg').textContent = result.message;

    if (result.ok) {
      if (result.accountType === 'seller') {
        localStorage.setItem('sellhub_seller', JSON.stringify(result.account));
        localStorage.setItem('sellhub_seller_token', result.token);
        setTimeout(() => window.location.href = nextParam || '/seller-onboarding', 600);
      } else {
        localStorage.setItem('sellhub_customer', JSON.stringify(result.account));
        localStorage.setItem('sellhub_customer_token', result.token);
        setTimeout(() => window.location.href = nextParam || '/dashboard', 600);
      }
    }
  }

  // Google Sign-In — the button below renders itself once this library
  // loads, and calls handleGoogleCredential with the signed token.
  window.onload = function () {
    google.accounts.id.initialize({
      client_id: '760370316489-3nu21q1e2jrvrl85fj40bs0n6dr43tra.apps.googleusercontent.com',
      callback: handleGoogleCredential
    });
    google.accounts.id.renderButton(
      document.getElementById('g_id_signin'),
      { theme: 'outline', size: 'large', text: 'signin_with', width: 280 }
    );
  };

  async function handleGoogleCredential(response) {
    const res = await fetch('/api/google-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: response.credential })
    });
    const result = await res.json();
    document.getElementById('msg').textContent = result.message;
    document.getElementById('msg').style.color = result.ok ? 'var(--green-700)' : '#B4232C';

    if (result.ok) {
      if (result.accountType === 'seller') {
        localStorage.setItem('sellhub_seller', JSON.stringify(result.account));
        localStorage.setItem('sellhub_seller_token', result.token);
        setTimeout(() => window.location.href = nextParam || '/seller-onboarding', 600);
      } else {
        localStorage.setItem('sellhub_customer', JSON.stringify(result.account));
        localStorage.setItem('sellhub_customer_token', result.token);
        setTimeout(() => window.location.href = nextParam || '/dashboard', 600);
      }
    }
  }
</script>
<script src="/support-widget.js?v=7" defer></script>
</body>
</html>
