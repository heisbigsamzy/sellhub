<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Store — SellHub</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@560&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green-900:#0B3D28; --green-700:#0F7A4A; --green-600:#149A5C; --green-400:#3FC17F;
    --mint-100:#EAF7EF; --mint-50:#F5FBF7; --ink:#0B0F0C; --gray-600:#5B6B62; --gray-300:#DCE6E0;
    --radius-lg:24px; --radius-md:18px; --radius-sm:12px; --radius-pill:100px;
    --shadow-resting:0 10px 24px -14px rgba(11,61,40,0.22);
    --shadow-hover:0 22px 44px -18px rgba(11,61,40,0.3);
    --shadow-card:0 12px 30px -12px rgba(11,61,40,0.28);
    --shadow-soft:0 20px 60px -20px rgba(11,15,12,0.25);
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;}
  body{margin:0; min-height:100vh; font-family:'Manrope',sans-serif; color:var(--ink); overflow-x:hidden;
    background:radial-gradient(900px 480px at 85% -10%, rgba(63,193,127,0.10), transparent 60%), linear-gradient(180deg, var(--mint-50) 0%, #fff 420px);}
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:560; margin:0; letter-spacing:-0.01em;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
  }
  a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2.5px solid var(--green-600); outline-offset:2px; border-radius:8px;
  }

  .topbar{background:rgba(255,255,255,0.86); backdrop-filter:blur(14px) saturate(160%); border-bottom:1px solid rgba(11,61,40,0.08); position:sticky; top:0; z-index:20; padding:14px 24px;}
  .topbar-inner{max-width:1100px; margin:0 auto; display:flex; align-items:center; justify-content:space-between;}
  .site-logo{display:flex; align-items:center; gap:9px; font-family:'Fraunces',serif; font-weight:560; font-size:16px; text-decoration:none; color:var(--ink);}
  .site-logo-mark{width:26px; height:26px; border-radius:8px; background:linear-gradient(150deg,var(--green-400),var(--green-700)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; box-shadow:0 6px 14px -4px rgba(15,122,74,0.4); flex-shrink:0;}
  .topbar-link{font-size:13px; font-weight:700; color:var(--green-900); text-decoration:none; padding:9px 18px; border-radius:var(--radius-pill); background:var(--mint-100); transition:background .2s, transform .2s;}
  .topbar-link:hover{background:#DFF1E6; transform:translateY(-1px);}

  .cover{height:260px; background:linear-gradient(155deg,var(--green-700),var(--green-900)); background-size:cover; background-position:center; position:relative; overflow:hidden;}
  .cover::before{content:""; position:absolute; width:320px; height:320px; border-radius:50%; background:radial-gradient(circle,rgba(63,193,127,0.3),transparent 70%); top:-120px; right:-60px;}
  .cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.3) 100%);}
  .store-header{max-width:1100px; margin:0 auto; padding:0 28px;}
  .store-id-row{display:flex; align-items:flex-end; gap:22px; padding:0 0 26px; flex-wrap:wrap;}
  .store-logo{width:104px; height:104px; border-radius:var(--radius-lg); border:5px solid #fff; background:var(--mint-100); overflow:hidden; box-shadow:var(--shadow-soft); flex-shrink:0; margin-top:-52px; position:relative; z-index:3;}
  .store-logo img{width:100%; height:100%; object-fit:cover; display:block;}
  .store-logo .placeholder{width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:36px; color:var(--green-700); font-weight:700;}
  .store-name-block{padding-top:18px;}
  .store-name{font-size:28px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .store-meta{font-size:13.5px; color:var(--gray-600); margin-top:7px;}
  .verified-seller-badge{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700; padding:5px 13px; border-radius:var(--radius-pill);}
  .verified-seller-badge.yes{background:var(--mint-100); color:var(--green-900);}
  .verified-seller-badge.no{background:#F2F2F2; color:var(--gray-600);}
  .category-chip{display:inline-block; background:var(--mint-100); color:var(--green-900); font-size:11.5px; font-weight:700; padding:4px 13px; border-radius:var(--radius-pill); margin-top:11px;}

  main{max-width:1100px; margin:0 auto; padding:8px 28px 90px;}
  .p-search{width:100%; padding:14px 20px; margin:26px 0; border-radius:var(--radius-pill); border:1.5px solid var(--gray-300); font-size:16px; font-family:'Manrope',sans-serif; outline:none; background:#fff; box-shadow:0 2px 10px -6px rgba(11,15,12,0.08); transition:border-color .2s, box-shadow .2s;}
  .p-search:focus{border-color:var(--green-600); box-shadow:0 2px 14px -6px rgba(15,122,74,0.22);}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:18px;}
  .p-card{background:#fff; border:1px solid var(--gray-300); border-radius:var(--radius-md); padding:16px; cursor:pointer; box-shadow:var(--shadow-resting); transition:transform .3s, box-shadow .3s, border-color .3s;}
  .p-card:hover{transform:translateY(-4px); box-shadow:var(--shadow-hover); border-color:rgba(15,122,74,0.22);}
  .p-thumb{height:112px; border-radius:var(--radius-sm); margin-bottom:12px; position:relative; overflow:hidden; background:var(--mint-50);}
  .p-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .p-thumb .no-photo{display:flex; align-items:center; justify-content:center; height:100%; color:var(--gray-600); font-size:11px;}
  .p-stock-badge{position:absolute; top:8px; right:8px; font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:var(--radius-pill);}
  .p-stock-badge.in{background:var(--mint-100); color:var(--green-900);}
  .p-stock-badge.out{background:#FDEAEA; color:#B4232C;}
  .p-name{font-size:14.5px; font-weight:700; line-height:1.3;}
  .p-rating{font-size:11.5px; color:var(--green-700); font-weight:700; margin-top:4px;}
  .p-price-row{display:flex; align-items:center; gap:7px; margin-top:9px;}
  .p-price-old{font-size:12px; color:var(--gray-600); text-decoration:line-through;}
  .p-price{font-family:'Fraunces',serif; font-size:17px; font-weight:560; color:var(--green-700);}

  .empty{text-align:center; padding:64px 20px; color:var(--gray-600);}
  .empty h3{color:var(--ink); margin-bottom:8px; font-size:19px;}
  .empty p{font-size:13.5px;}

  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(11,15,12,0.55); backdrop-filter:blur(4px); z-index:100; align-items:center; justify-content:center; padding:20px;}
  .modal-overlay.active{display:flex;}
  .modal{background:#fff; border-radius:var(--radius-lg); max-width:480px; width:100%; max-height:85vh; overflow-y:auto; padding:30px; box-shadow:var(--shadow-soft);}
  .modal-close{float:right; background:none; border:none; font-size:20px; cursor:pointer; color:var(--gray-600); transition:color .2s;}
  .modal-close:hover{color:var(--ink);}
  .modal-thumb{height:260px; border-radius:var(--radius-sm); margin-bottom:14px; overflow:hidden; background:var(--mint-50); cursor:zoom-in;}
  .modal-thumb img{width:100%; height:100%; object-fit:contain; display:block;}
  .modal-price{font-family:'Fraunces',serif; font-size:22px; font-weight:560; color:var(--green-700); margin:8px 0 16px;}
  .modal-btn{width:100%; margin-top:10px; padding:14px; border-radius:var(--radius-pill); font-weight:700; cursor:pointer; font-family:'Manrope',sans-serif; border:none; font-size:14px; transition:transform .2s, box-shadow .2s, background .2s;}
  .modal-btn.primary{background:linear-gradient(155deg,var(--green-600),var(--green-900)); color:#fff; box-shadow:0 12px 24px -10px rgba(15,122,74,0.55);}
  .modal-btn.primary:hover{transform:translateY(-1px); box-shadow:0 16px 28px -10px rgba(15,122,74,0.65);}
  .modal-btn.ghost{background:var(--mint-100); color:var(--green-900);}
  .modal-btn.ghost:hover{background:#DFF1E6;}
  .review-row{border-top:1px solid var(--gray-300); padding-top:13px; margin-top:13px;}
  .review-row .rname{font-weight:700; font-size:13px;}
  .verified-badge{background:var(--mint-100); color:var(--green-900); font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:var(--radius-pill); margin-left:6px;}
  .stars{color:#F5A623; font-size:13px;}

  .lightbox-overlay{display:none; position:fixed; inset:0; background:rgba(11,15,12,0.9); z-index:200; align-items:center; justify-content:center; padding:24px;}
  .lightbox-overlay.active{display:flex;}
  .lightbox-overlay img{max-width:100%; max-height:100%; object-fit:contain; border-radius:var(--radius-sm);}
  .lightbox-close{position:absolute; top:20px; right:24px; background:none; border:none; color:#fff; font-size:32px; cursor:pointer;}

  @media (max-width:480px){
    .cover{height:190px;}
    .store-logo{width:84px; height:84px; margin-top:-42px; border-width:4px;}
    .store-logo .placeholder{font-size:28px;}
    .store-name{font-size:22px;}
    .store-header{padding:0 20px;}
    main{padding:8px 20px 70px;}
    .topbar{padding:12px 16px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="/" class="site-logo"><span class="site-logo-mark">S</span>SellHub</a>
    <a href="/dashboard" class="topbar-link" id="cartLink">My Account</a>
  </div>
</div>

<div class="cover" id="coverImage"></div>

<div class="store-header">
  <div class="store-id-row">
    <div class="store-logo" id="storeLogo"><div class="placeholder">S</div></div>
    <div class="store-name-block">
      <div class="store-name"><span id="storeName">Loading...</span><span id="verifiedBadgeHolder"></span></div>
      <div class="store-meta" id="storeMeta"></div>
      <div id="categoryChipHolder"></div>
    </div>
  </div>
</div>

<main>
  <input id="p_search" class="p-search" placeholder="Search this store's products..." oninput="renderProducts()">
  <div class="grid" id="productGrid"></div>
</main>

<div class="modal-overlay" id="viewModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('viewModal')">&times;</button>
    <div id="viewModalBody"></div>
  </div>
</div>

<div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <img id="lightboxImg" src="">
</div>

<script>
  const slug = window.location.pathname.split('/store/')[1];
  let store = null;
  let products = [];

  const customer = JSON.parse(localStorage.getItem('sellhub_customer') || 'null');
  const authToken = localStorage.getItem('sellhub_customer_token');
  const CART_KEY = 'sellhub_cart_' + (customer ? customer.email : 'guest');

  function money(n){ return '₦' + Number(n).toLocaleString(); }
  function stars(avg){
    if (!avg) return '';
    return '★'.repeat(Math.round(avg)) + '☆'.repeat(5 - Math.round(avg));
  }
  function closeModal(id){ document.getElementById(id).classList.remove('active'); }
  function openModal(id){ document.getElementById(id).classList.add('active'); }
  function openLightbox(src){
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightboxOverlay').classList.add('active');
  }
  function closeLightbox(){ document.getElementById('lightboxOverlay').classList.remove('active'); }

  function verifiedBadge(verified){
    return verified
      ? `<span class="verified-seller-badge yes">✓ Verified Seller</span>`
      : `<span class="verified-seller-badge no">Pending Verification</span>`;
  }
  function productThumb(p){
    return (p.images && p.images[0]) ? `<img src="${p.images[0]}">` : `<div class="no-photo">No photo</div>`;
  }
  function stockBadge(p){
    const out = p.status === 'Out of Stock';
    return `<span class="p-stock-badge ${out ? 'out' : 'in'}">${out ? 'Out of Stock' : 'In Stock'}</span>`;
  }
  function priceDisplay(p){
    return p.discountPrice
      ? `<span class="p-price">${money(p.discountPrice)}</span> <span class="p-price-old">${money(p.price)}</span>`
      : `<span class="p-price">${money(p.price)}</span>`;
  }

  async function loadStore(){
    if (!slug) return;
    const res = await fetch('/api/store-info?slug=' + encodeURIComponent(slug));
    const result = await res.json();
    if (!result.ok) {
      document.querySelector('main').innerHTML = `<div class="empty"><h3>Store not found</h3><p>This store link may be incorrect or no longer active.</p></div>`;
      return;
    }
    store = result.store;
    products = result.products || [];

    document.title = store.businessName + ' — SellHub';
    document.getElementById('storeName').textContent = store.businessName;
    document.getElementById('verifiedBadgeHolder').innerHTML = verifiedBadge(store.sellerVerified);
    document.getElementById('storeMeta').textContent = [store.city, store.state].filter(Boolean).join(', ');
    if (store.category) {
      document.getElementById('categoryChipHolder').innerHTML = `<span class="category-chip">${store.category}</span>`;
    }
    if (store.coverImage) {
      document.getElementById('coverImage').style.backgroundImage = `url('${store.coverImage}')`;
    }
    if (store.logoImage) {
      document.getElementById('storeLogo').innerHTML = `<img src="${store.logoImage}">`;
    }

    renderProducts();
  }

  function renderProducts(){
    const grid = document.getElementById('productGrid');
    const query = (document.getElementById('p_search').value || '').trim().toLowerCase();
    const filtered = query ? products.filter(p => p.name.toLowerCase().includes(query)) : products;

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1;"><h3>${products.length === 0 ? 'No products yet' : 'No products match'}</h3><p>${products.length === 0 ? "This store hasn't added any products yet." : 'Try a different search term.'}</p></div>`;
      return;
    }

    grid.innerHTML = filtered.map(p => `
      <div class="p-card" onclick="viewProduct(${p.id})">
        <div class="p-thumb">${productThumb(p)}${stockBadge(p)}</div>
        <div class="p-name">${p.name}</div>
        <div class="p-rating">${p.avgRating ? stars(p.avgRating) + ' (' + p.reviewCount + ')' : 'No reviews yet'}</div>
        <div class="p-price-row">${priceDisplay(p)}</div>
      </div>
    `).join('');
  }

  async function viewProduct(id){
    const p = products.find(x => x.id === id);
    if (!p) return;
    const res = await fetch('/api/reviews?productId=' + id);
    const result = await res.json();
    const reviews = result.reviews || [];

    document.getElementById('viewModalBody').innerHTML = `
      <div class="modal-thumb" ${p.images && p.images[0] ? `onclick="openLightbox('${p.images[0]}')"` : ''}>${productThumb(p)}</div>
      <h2>${p.name}</h2>
      ${p.description ? `<p style="font-size:13.5px; color:var(--gray-600); margin-top:8px;">${p.description}</p>` : ''}
      <div class="p-rating" style="margin-top:6px;">${p.avgRating ? stars(p.avgRating) + ' (' + p.reviewCount + ' reviews)' : 'No reviews yet'}</div>
      <div class="modal-price">${priceDisplay(p)}</div>
      ${p.status === 'Out of Stock'
        ? `<button class="modal-btn ghost" disabled style="opacity:0.5; cursor:not-allowed;">Out of Stock</button>`
        : `
          <button class="modal-btn primary" onclick="addToCartAndGo(${p.id})">Buy Now</button>
          <button class="modal-btn ghost" onclick="addToCart(${p.id})">Add to Cart</button>
        `}
      <div>
        ${reviews.length === 0 ? '<p style="color:var(--gray-600); font-size:13px; margin-top:16px;">No reviews yet.</p>' :
          reviews.map(r => `
            <div class="review-row">
              <span class="rname">${r.customerName}</span>${r.verifiedPurchase ? '<span class="verified-badge">Verified Purchase</span>' : ''}
              <div class="stars">${stars(r.rating)}</div>
              <p style="font-size:13px; color:var(--gray-600); margin-top:4px;">${r.text}</p>
            </div>
          `).join('')}
      </div>
    `;
    openModal('viewModal');
  }

  // If a guest clicks Buy/Add to Cart, we send them to log in — but we
  // first remember exactly where they were (this store + this product +
  // what they were trying to do) in the URL we send them to log in with.
  // Login/signup read that `next` and return the customer here afterward,
  // with `resume` added so this page finishes the action automatically —
  // instead of dumping them on the homepage or back at an empty store.
  function requireLogin(id, action){
    if (!customer || !authToken) {
      const here = '/store/' + slug + (id ? ('?resume=' + action + '&pid=' + id) : '');
      window.location.href = '/login?next=' + encodeURIComponent(here);
      return false;
    }
    return true;
  }

  function addToCart(id){
    if (!requireLogin(id, 'cart')) return;
    const cart = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
    cart.push(id);
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    alert('Added to cart!');
    closeModal('viewModal');
  }

  function addToCartAndGo(id){
    if (!requireLogin(id, 'buy')) return;
    const cart = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
    cart.push(id);
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    window.location.href = '/dashboard';
  }

  if (customer) document.getElementById('cartLink').textContent = 'My Account';
  else document.getElementById('cartLink').textContent = 'Log In';

  // Resumes exactly what the customer was doing before they were sent to
  // log in: open the same product again and continue the Buy/Add to Cart
  // they started, now that they're authenticated — no re-searching needed.
  async function resumeIfNeeded(){
    const params = new URLSearchParams(window.location.search);
    const resume = params.get('resume');
    const pid = Number(params.get('pid'));
    if (!resume || !pid || !customer || !authToken) return;
    history.replaceState(null, '', '/store/' + slug);
    await viewProduct(pid);
    if (resume === 'buy') addToCartAndGo(pid);
    else if (resume === 'cart') addToCart(pid);
  }

  loadStore().then(resumeIfNeeded);
</script>
</body>
</html>
